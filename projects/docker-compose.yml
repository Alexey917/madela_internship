services:
  payment-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      POSTGRES_DB: payments_db
    ports:
      - "5435:5432"
    volumes:
      - payment_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payments_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: catalog
      RABBITMQ_DEFAULT_PASS: catalog
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  payment:
    build:
      context: ./services/payment
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://payment:payment@payment-postgres:5432/payments_db
      REDIS_URL: redis://redis:6379/2
      RABBITMQ_URL: amqp://catalog:catalog@rabbitmq:5672/
      MOCK_GATEWAY_URL: http://localhost:8003/mock-gateway
      SERVICE_NAME: payment-service
      LOG_LEVEL: INFO  
    ports:
      - "8003:8000"
    depends_on:
      payment-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  payment_pg_data: