services:
  order-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
      POSTGRES_DB: orders_db
    ports:
      - "5436:5432"
    volums:
      - order_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d orders_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    mage: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: catalog
      RABBITMQ_DEFAULT_PASS: catalog
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  order:
    build:
      context: ./services/order
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://order:order@order-postgres:5432/orders_db
      REDIS_URL: redis://redis:6379/3
      RABBITMQ_URL: amqp://catalog:catalog@rabbitmq:5672/
      SERVICE_NAME: order-service
      LOG_LEVEL: INFO
    ports:
      - "8004:8000"
    depends_on:
      order-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy


volumes:
  order_pg_data:

