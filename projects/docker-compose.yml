services:
  catalog-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog_db
    ports:
      - "5433:5432"
    volumes:
      - catalog_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog_db"]
      interval: 5s
      timeout: 3s
      retries: 5
  
  catalog-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  catalog:
    build:
      context: ./services/catalog
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://catalog:catalog@catalog-postgres:5432/catalog_db
      REDIS_URL: redis://catalog-redis:6379/0
      SERVICE_NAME: catalog-service
      LOG_LEVEL: INFO
    ports:
      - "8001:8000"
    depends_on:
      catalog-postgres:
        condition: service_healthy
      catalog-redis:
        condition: service_healthy

volumes:
  catalog_pg_data: