worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # CORS
    map $http_origin $cors_origin {
        default "";
        "~^http://localhost" $http_origin;
    }

    upstream catalog {
        server catalog:8000;
    }
    upstream inventory {
        server inventory:8000;
    }
    upstream payment {
        server payment:8000;
    }
    upstream order {
        server order:8000;
    }
    upstream ui {
        server ui:80;
    }
    upstream auth {
        server auth:8000;
    }

    server {
        listen 80;
        server_name _;

        # CORS preflight
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Idempotency-Key, Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        if ($request_method = 'OPTIONS') {
            add_header Content-Length 0;
            add_header Content-Type 'text/plain; charset=utf-8';
            return 204;
        }

        
        location / {
            proxy_pass http://ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }


        # Catalog
        location /api/products {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://catalog;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/products {
            auth_request /_auth;
            auth_request_set $auth_role $upstream_http_x_role;

            if ($auth_role != "admin") {
                return 403;
            }

            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://catalog;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Inventory
        location /api/stock {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://inventory;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Payment
        location /api/payments {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://payment;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Order
        location /api/orders {
            auth_request /_auth;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_role $upstream_http_x_role;


            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://order;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Role $auth_role;
        }

        location = /_auth {
            internal;
            proxy_pass http://auth/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        # Login — публичный
        location /api/auth/ {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://auth;
            proxy_set_header Host $host;
        }

        # Health checks (для отладки)
        location /health/catalog { proxy_pass http://catalog/health; }
        location /health/inventory { proxy_pass http://inventory/health; }
        location /health/payment { proxy_pass http://payment/health; }
        location /health/order { proxy_pass http://order/health; }
    }


}