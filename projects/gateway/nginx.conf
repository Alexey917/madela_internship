worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # CORS
    map $http_origin $cors_origin {
        default "";
        "~^http://localhost" $http_origin;
    }

    upstream auth       { server auth:8000; }
    upstream catalog    { server catalog:8000; }
    upstream inventory  { server inventory:8000; }
    upstream payment    { server payment:8000; }
    upstream order      { server order:8000; }
    upstream ui         { server ui:80; }

    server {
        listen 80;
        server_name _;

        # CORS preflight
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Idempotency-Key, Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'X-User-Id, X-User-Role' always;

        if ($request_method = 'OPTIONS') {
            add_header Content-Length 0;
            add_header Content-Type 'text/plain; charset=utf-8';
            return 204;
        }

        
        # --- UI ---
        location / {
            proxy_pass http://ui;
            proxy_set_header Host $host;
        }


         # --- Auth (публичный) ---
        location /api/auth/ {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://auth;
            proxy_set_header Host $host;
        }

        # --- Catalog ---
        # GET /api/products — публичный
        location = /api/products {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://catalog;
            proxy_set_header Host $host;
        }

        location ~ ^/api/products/[0-9]+$ {
            # GET /products/{id} — публичный, PUT — admin
            limit_except GET {
                auth_request /_auth_admin;
                auth_request_set $auth_user_id $upstream_http_x_user_id;
                auth_request_set $auth_role $upstream_http_x_role;
                proxy_set_header X-User-Id $auth_user_id;
                proxy_set_header X-User-Role $auth_role;
            }
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://catalog;
            proxy_set_header Host $host;
        }

        # POST /api/products — admin
        location /api/products {
            limit_except GET {
                auth_request /_auth_admin;
                auth_request_set $auth_user_id $upstream_http_x_user_id;
                auth_request_set $auth_role $upstream_http_x_role;
                proxy_set_header X-User-Id $auth_user_id;
                proxy_set_header X-User-Role $auth_role;
            }
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://catalog;
            proxy_set_header Host $host;
        }

        # --- Inventory (защищённый) ---
        location /api/stock {
            auth_request /_auth;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_role $upstream_http_x_role;
            auth_request_set $auth_email $upstream_http_x_user_email;

            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://inventory;
            proxy_set_header Host $host;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Role $auth_role;
            proxy_set_header X-User-Email $auth_email;
        }

        # --- Payment (защищённый) ---
        location /api/payments {
            auth_request /_auth;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_role $upstream_http_x_role;
            auth_request_set $auth_email $upstream_http_x_user_email;

            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://payment;
            proxy_set_header Host $host;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Role $auth_role;
            proxy_set_header X-User-Email $auth_email;
        }

        # --- Orders (защищённый) ---
        location /api/orders {
            auth_request /_auth;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_role $upstream_http_x_role;
            auth_request_set $auth_email $upstream_http_x_user_email;

            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://order;
            proxy_set_header Host $host;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Role $auth_role;
            proxy_set_header X-User-Email $auth_email;
        }

        # --- Внутренние проверки ---
        location = /_auth {
            internal;
            proxy_pass http://auth/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        location = /_auth_admin {
            internal;
            proxy_pass http://auth/auth/verify-admin;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        # Health checks
        location /health/catalog   { proxy_pass http://catalog/health; }
        location /health/inventory { proxy_pass http://inventory/health; }
        location /health/payment   { proxy_pass http://payment/health; }
        location /health/order     { proxy_pass http://order/health; }
        location /health/auth      { proxy_pass http://auth/health; }
    }


}