worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # CORS
    map $http_origin $cors_origin {
        default "";
        "~^http://localhost" $http_origin;
    }

    upstream catalog {
        server catalog:8000;
    }
    upstream inventory {
        server inventory:8000;
    }
    upstream payment {
        server payment:8000;
    }
    upstream order {
        server order:8000;
    }
    upstream ui {
        server ui:80;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # CORS preflight
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Idempotency-Key, Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # SPA: все неизвестные пути → index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        location / {
            proxy_pass http://ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Прокси API → Gateway (если UI открыт напрямую на 3000)
        # Для прод-сборки через Gateway — этот блок не нужен (Gateway сам проксирует)
        location /api/ {
            proxy_pass http://gateway:80/api/;
            proxy_set_header Host $host;
        }

        # Catalog
        location /api/products {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://catalog;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Inventory
        location /api/stock {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://inventory;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Payment
        location /api/payments {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://payment;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Order
        location /api/orders {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://order;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health checks (для отладки)
        location /health/catalog { proxy_pass http://catalog/health; }
        location /health/inventory { proxy_pass http://inventory/health; }
        location /health/payment { proxy_pass http://payment/health; }
        location /health/order { proxy_pass http://order/health; }
    }


}