[project]
name = "order-service"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = "^3.12"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy[asyncio] (>=2.1.8,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "prometheus-fastapi-instrumentator (>=8.1.0,<9.0.0)",
    "aio-pika (>=10.2.2,<11.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "gitverse"
url = "https://pypi-mirror.gitverse.ru/simple/"
priority = "primary"

[dependency-groups]
dev = [
    "ruff (>=0.17.4,<0.18.0)",
    "black (>=26.10.1,<27.0.0)",
    "mypy (>=2.4.1,<3.0.0)"
]
