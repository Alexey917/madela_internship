[project]
name = "payment-service"
version = "0.1.0"
description = "Payment service — payment gateway integration for Board Games Shop"
authors = [
    {name = "Alexey917",email = "pochtovii.1996@mail.ru"}
]
requires-python = "^3.12"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy[asyncio] (>=2.1.6,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "pydantic-settings (>=2.16.1,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "prometheus-fastapi-instrumentator (>=8.1.0,<9.0.0)",
    "tenacity (>=9.2.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.3,<0.18.0)",
    "black (>=26.10.1,<27.0.0)",
    "mypy (>=2.4.0,<3.0.0)"
]
