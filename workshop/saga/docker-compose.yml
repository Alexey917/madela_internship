services:
  catalog:
    build: ./catalog
    container_name: catalog
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  orders:
    build: ./orders
    container_name: orders
    ports:
      - "8001:8001"
    environment:
      - CATALOG_URL=http://catalog:8002
    depends_on:
      - catalog
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8000:8000"
    environment:
      - ORDERS_URL=http://orders:8001
      - CATALOG_URL=http://catalog:8002
    depends_on:
      - orders
      - catalog
