services:
  shop-postgres:
    image: postgres:17
    container_name: shop_db
    environment:
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: shop_password
      POSTGRES_DB: shop_db
    ports:
      - "5450:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_user -d shop_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: shop-app
    depends_on:
      - shop-postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://shop_user:shop_password@shop-postgres:5432/shop_db

volumes:
  pgdata:
