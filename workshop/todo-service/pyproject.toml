description = ""
authors = [
    {name = "Alexey917",email = "pochtovii.1996@mail.ru"}
]
requires-python = "^3.12"
dependencies = [
    "fastapi (>=0.142.3,<0.143.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy[asyncio] (>=2.1.4,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.0,<2.0.0)",
